<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#052830"/>
      <stop offset="45%" stop-color="#0a2f38"/>
      <stop offset="100%" stop-color="#03161c"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#0d4a52" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#0d4a52" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridSm" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#1a5560" stroke-width="0.4" opacity="0.35"/>
    </pattern>
    <pattern id="gridLg" x="0" y="0" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" fill="none" stroke="#2a7a82" stroke-width="0.5" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="390" height="844" fill="url(#bgGrad)"/>
  <rect width="390" height="844" fill="url(#gridSm)"/>
  <rect width="390" height="844" fill="url(#gridLg)"/>
  <rect width="390" height="844" fill="url(#glowGrad)"/>

  <!-- ===== Globe (mid-right, ниже title-зоны) ===== -->
  <g transform="translate(340,330)" stroke="#3a8a92" fill="none" stroke-width="0.7" opacity="0.32">
    <circle r="110"/>
    <circle r="85" opacity="0.6"/>
    <circle r="60" opacity="0.5"/>
    <circle r="35" opacity="0.4"/>
    <ellipse rx="110" ry="28"/>
    <ellipse rx="110" ry="58"/>
    <ellipse rx="110" ry="86"/>
    <ellipse rx="110" ry="14" opacity="0.5"/>
    <ellipse rx="28" ry="110"/>
    <ellipse rx="58" ry="110"/>
    <ellipse rx="86" ry="110"/>
    <ellipse rx="14" ry="110" opacity="0.5"/>
    <g opacity="0.7" stroke="#5fbac0" stroke-width="0.5">
      <path d="M-28 -42 Q-14 -53 4 -46 T 36 -39 Q 42 -28 32 -18 T 7 -10 Q -18 -14 -28 -28 Z"/>
      <path d="M-50 7 Q-36 4 -22 13 T 0 21 Q -7 36 -25 39 T -54 32 Q -60 20 -50 7 Z"/>
    </g>
  </g>

  <!-- ===== Gear (bottom-left) ===== -->
  <g transform="translate(40,720)" stroke="#3a8a92" fill="none" stroke-width="0.8" opacity="0.55">
    <circle r="78"/>
    <circle r="58" opacity="0.7"/>
    <circle r="32" opacity="0.6"/>
    <circle r="14" opacity="0.5"/>
    <!-- teeth (12) -->
    <g>
      <g><rect x="-7" y="-92" width="14" height="20" rx="2"/></g>
      <g transform="rotate(30)"><rect x="-7" y="-92" width="14" height="20" rx="2"/></g>
      <g transform="rotate(60)"><rect x="-7" y="-92" width="14" height="20" rx="2"/></g>
      <g transform="rotate(90)"><rect x="-7" y="-92" width="14" height="20" rx="2"/></g>
      <g transform="rotate(120)"><rect x="-7" y="-92" width="14" height="20" rx="2"/></g>
      <g transform="rotate(150)"><rect x="-7" y="-92" width="14" height="20" rx="2"/></g>
      <g transform="rotate(180)"><rect x="-7" y="-92" width="14" height="20" rx="2"/></g>
      <g transform="rotate(210)"><rect x="-7" y="-92" width="14" height="20" rx="2"/></g>
      <g transform="rotate(240)"><rect x="-7" y="-92" width="14" height="20" rx="2"/></g>
      <g transform="rotate(270)"><rect x="-7" y="-92" width="14" height="20" rx="2"/></g>
      <g transform="rotate(300)"><rect x="-7" y="-92" width="14" height="20" rx="2"/></g>
      <g transform="rotate(330)"><rect x="-7" y="-92" width="14" height="20" rx="2"/></g>
    </g>
    <!-- spokes -->
    <line x1="-58" y1="0" x2="-32" y2="0"/>
    <line x1="58" y1="0" x2="32" y2="0"/>
    <line x1="0" y1="-58" x2="0" y2="-32"/>
    <line x1="0" y1="58" x2="0" y2="32"/>
  </g>

  <!-- ===== City wireframe (тонкая полоса в самом низу) ===== -->
  <g transform="translate(195,765) scale(0.55)" stroke="#5fbac0" fill="none" stroke-width="1.1" opacity="0.55">
    <!-- ground -->
    <line x1="0" y1="160" x2="180" y2="160"/>
    <!-- buildings -->
    <rect x="6" y="80" width="22" height="80"/>
    <line x1="6" y1="100" x2="28" y2="100"/>
    <line x1="6" y1="120" x2="28" y2="120"/>
    <line x1="6" y1="140" x2="28" y2="140"/>
    <line x1="17" y1="80" x2="17" y2="160"/>

    <rect x="32" y="40" width="28" height="120"/>
    <line x1="32" y1="60" x2="60" y2="60"/>
    <line x1="32" y1="80" x2="60" y2="80"/>
    <line x1="32" y1="100" x2="60" y2="100"/>
    <line x1="32" y1="120" x2="60" y2="120"/>
    <line x1="32" y1="140" x2="60" y2="140"/>
    <line x1="46" y1="40" x2="46" y2="160"/>

    <rect x="64" y="20" width="20" height="140"/>
    <line x1="64" y1="40" x2="84" y2="40"/>
    <line x1="64" y1="60" x2="84" y2="60"/>
    <line x1="64" y1="80" x2="84" y2="80"/>
    <line x1="64" y1="100" x2="84" y2="100"/>
    <line x1="64" y1="120" x2="84" y2="120"/>
    <line x1="64" y1="140" x2="84" y2="140"/>

    <rect x="88" y="60" width="32" height="100"/>
    <line x1="88" y1="80" x2="120" y2="80"/>
    <line x1="88" y1="100" x2="120" y2="100"/>
    <line x1="88" y1="120" x2="120" y2="120"/>
    <line x1="88" y1="140" x2="120" y2="140"/>
    <line x1="104" y1="60" x2="104" y2="160"/>

    <rect x="124" y="50" width="22" height="110"/>
    <line x1="124" y1="70" x2="146" y2="70"/>
    <line x1="124" y1="90" x2="146" y2="90"/>
    <line x1="124" y1="110" x2="146" y2="110"/>
    <line x1="124" y1="130" x2="146" y2="130"/>

    <rect x="150" y="90" width="24" height="70"/>
    <line x1="150" y1="110" x2="174" y2="110"/>
    <line x1="150" y1="130" x2="174" y2="130"/>
    <line x1="162" y1="90" x2="162" y2="160"/>
  </g>

  <!-- ===== Corner targeting brackets ===== -->
  <g stroke="#5fbac0" fill="none" stroke-width="1" opacity="0.85">
    <!-- TL -->
    <g transform="translate(14,14)">
      <path d="M0 16 V0 H16"/>
      <line x1="-4" y1="20" x2="20" y2="20" opacity="0"/>
      <circle cx="20" cy="20" r="3"/>
      <line x1="20" y1="14" x2="20" y2="26"/>
      <line x1="14" y1="20" x2="26" y2="20"/>
    </g>
    <!-- TR -->
    <g transform="translate(376,14)">
      <path d="M0 16 V0 H-16"/>
      <circle cx="-20" cy="20" r="3"/>
      <line x1="-20" y1="14" x2="-20" y2="26"/>
      <line x1="-14" y1="20" x2="-26" y2="20"/>
    </g>
    <!-- BL -->
    <g transform="translate(14,830)">
      <path d="M0 -16 V0 H16"/>
      <circle cx="20" cy="-20" r="3"/>
      <line x1="20" y1="-14" x2="20" y2="-26"/>
      <line x1="14" y1="-20" x2="26" y2="-20"/>
    </g>
    <!-- BR -->
    <g transform="translate(376,830)">
      <path d="M0 -16 V0 H-16"/>
      <circle cx="-20" cy="-20" r="3"/>
      <line x1="-20" y1="-14" x2="-20" y2="-26"/>
      <line x1="-14" y1="-20" x2="-26" y2="-20"/>
    </g>
  </g>

  <!-- subtle vignette -->
  <radialGradient id="vignette" cx="50%" cy="55%" r="80%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="390" height="844" fill="url(#vignette)"/>
</svg>
