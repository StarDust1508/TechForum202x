<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03161c" />
    <meta name="color-scheme" content="dark" />

    <title>TechForum 2026</title>
    <meta name="description" content="Мобильное приложение конференции TechForum 2026 — программа, спикеры, чат, билет и расписание сессий." />

    <link rel="icon" type="image/png" href="./favicon-32x32.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iOS PWA support: позволяет «Добавить на главный экран» в Safari выглядеть как нативное приложение -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TechForum" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />

    <!-- Регистрация Service Worker (offline + installable) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW register failed', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
