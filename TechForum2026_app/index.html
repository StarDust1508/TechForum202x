<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1118" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Применяем сохранённую тему ДО первого рендера — иначе при светлой теме
      // мелькает тёмный фон. Полная логика — src/lib/theme.ts.
      try {
        if (localStorage.getItem('techforum_theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          var __m = document.querySelector('meta[name="theme-color"]');
          if (__m) __m.setAttribute('content', '#f3f4f9');
        }
      } catch (e) {}
    </script>

    <title>ТехнологИИ Права 2026</title>
    <meta name="description" content="Мобильное приложение конференции ТехнологИИ Права 2026 — программа, спикеры, чат, билет и расписание сессий." />

    <link rel="icon" type="image/png" href="./favicon-32x32.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./fonts/local-fonts.css" />

    <!-- Шрифты self-hosted из /fonts/. См. src/index.css → @import '/fonts/local-fonts.css'.
         Раньше тут был блокирующий <link> к fonts.googleapis.com — на cold-start
         WebView ждал DNS+TLS до Google перед первым рендером. Теперь весь
         типографический набор (Manrope/Forum/Cinzel/JetBrains Mono, cyrillic+latin)
         внутри APK, грузится мгновенно даже offline. -->

    <!-- iOS PWA support: позволяет «Добавить на главный экран» в Safari выглядеть как нативное приложение -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ТехнологИИ Права" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />

    <!-- DIAG: SW регистрация ОТКЛЮЧЕНА. Дополнительно агрессивно
         unregister'им все ранее установленные SW и чистим caches —
         старый SW из предыдущих APK переживает переустановку
         (WebView хранит SW-state отдельно) и режет fetch'и. -->
    <script>
      (async function () {
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const r of regs) { try { await r.unregister(); } catch (_) {} }
          }
          if (typeof caches !== 'undefined' && caches.keys) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k).catch(() => false)));
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
