<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03161c" />
    <meta name="color-scheme" content="dark" />

    <title>TechForum 2026</title>
    <meta name="description" content="Мобильное приложение конференции TechForum 2026 — программа, спикеры, чат, билет и расписание сессий." />

    <link rel="icon" type="image/png" href="./favicon-32x32.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Шрифты подключаем через preconnect + non-blocking link, чтобы не
         задерживать первый рендер. Раньше был @import в index.css — он
         блокировал critical CSS до DNS+TLS на fonts.googleapis.com. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Cormorant+Garamond:wght@400;500;600;700&family=Forum&family=JetBrains+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    />

    <!-- iOS PWA support: позволяет «Добавить на главный экран» в Safari выглядеть как нативное приложение -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TechForum" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />

    <!-- DIAG: SW регистрация ОТКЛЮЧЕНА. Дополнительно агрессивно
         unregister'им все ранее установленные SW и чистим caches —
         старый SW из предыдущих APK переживает переустановку
         (WebView хранит SW-state отдельно) и режет fetch'и. -->
    <script>
      (async function () {
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const r of regs) { try { await r.unregister(); } catch (_) {} }
          }
          if (typeof caches !== 'undefined' && caches.keys) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k).catch(() => false)));
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
