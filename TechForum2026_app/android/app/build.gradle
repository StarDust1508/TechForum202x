apply plugin: 'com.android.application'

def storeKeystorePath = providers.environmentVariable('TECHFORUM_ANDROID_KEYSTORE').orNull
def storeKeystorePassword = providers.environmentVariable('TECHFORUM_ANDROID_STORE_PASSWORD').orNull
def storeKeyAlias = providers.environmentVariable('TECHFORUM_ANDROID_KEY_ALIAS').orNull
def storeKeyPassword = providers.environmentVariable('TECHFORUM_ANDROID_KEY_PASSWORD').orNull
def storeSigningConfigured = [storeKeystorePath, storeKeystorePassword, storeKeyAlias, storeKeyPassword].every { it }
def servicesJSON = file('google-services.json')

android {
    namespace = "com.psy_lololo.conferenceapp"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.psy_lololo.conferenceapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 36
        versionName "1.8.11"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (storeSigningConfigured) {
            release {
                storeFile file(storeKeystorePath)
                storePassword storeKeystorePassword
                keyAlias storeKeyAlias
                keyPassword storeKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (storeSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Store artifacts fail closed. Debug builds remain available for local QA, but
// assembleRelease/bundleRelease may never silently use the Android debug key.
gradle.taskGraph.whenReady { graph ->
    def requestsStoreArtifact = graph.allTasks.any { task ->
        task.path in [':app:assembleRelease', ':app:bundleRelease', ':app:packageRelease']
    }
    if (requestsStoreArtifact && !storeSigningConfigured) {
        throw new GradleException('NO-GO: production Android signing is not configured; debug.keystore is forbidden for store artifacts.')
    }
    if (requestsStoreArtifact && !servicesJSON.isFile()) {
        throw new GradleException('NO-GO: google-services.json is required for this Android release with Push enabled.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (servicesJSON.isFile()) {
    def firebaseConfig = new groovy.json.JsonSlurper().parse(servicesJSON)
    def matchingClient = firebaseConfig.client?.find { client ->
        client.client_info?.android_client_info?.package_name == android.defaultConfig.applicationId
    }
    if (firebaseConfig.project_info?.project_id != 'techpravo-33f82' ||
        !firebaseConfig.project_info?.project_number ||
        !matchingClient?.client_info?.mobilesdk_app_id ||
        !matchingClient?.api_key?.any { it.current_key }) {
        throw new GradleException('NO-GO: Firebase configuration must match techpravo-33f82 and this applicationId.')
    }
    // Plugin/configuration failures must not silently produce a package without Push.
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn('Local debug build has no Firebase config. Release artifacts are blocked.')
}
