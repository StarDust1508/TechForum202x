name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'TechForum2026_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: TechForum2026_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: TechForum2026_app/package-lock.json

      - name: Setup Java 21 (Capacitor 8 + Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      # GUARD: пока бэкенд по cleartext (нет HTTPS-домена), androidScheme обязан
      # быть 'http' — иначе WebView origin https://localhost, fetch к http://72.56.38.62:3100
      # блокируется как mixed content. Симптом — "Нет соединения с сервером" в APK.
      # Когда переедем на HTTPS — удалить этот шаг. См. ARCHITECTURE.md §8.
      - name: Guard — androidScheme must be 'http' until HTTPS migration
        run: |
          if grep -E "androidScheme:[[:space:]]*['\"]https['\"]" capacitor.config.ts; then
            echo "::error::androidScheme is 'https' — это сломает APK (mixed content к http бэку). См. ARCHITECTURE.md §8."
            exit 1
          fi
          echo "OK: androidScheme is 'http'"

      - name: Write production frontend env
        run: |
          cat > .env.production <<EOF
          NODE_ENV=production
          VITE_API_BASE_URL=http://72.56.38.62/api/v1
          VITE_WS_BASE_URL=ws://72.56.38.62:3100
          VITE_ENABLE_LOCAL_FALLBACK=true
          EOF

      - name: Verify env file written
        run: cat .env.production

      # BUG_FIX_CONTEXT: vite.config.ts вызывает loadEnv но не подмешивает envPrefix
      # явно, и в предыдущих сборках VITE_API_BASE_URL не попадал в bundle (искали
      # литерал "72.56.38.62" в собранном JS — отсутствовал). Передаём ENV напрямую
      # в process.env для процесса vite build И добавляем --mode production явно.
      - name: Build Vite bundle (with explicit env)
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: http://72.56.38.62/api/v1
          VITE_WS_BASE_URL: ws://72.56.38.62:3100
          VITE_ENABLE_LOCAL_FALLBACK: 'true'
        run: |
          npx vite build --mode production
          echo "--- bundle env check ---"
          if ! grep -rq "72.56.38.62" dist/assets/; then
            echo "::error::API URL not baked into bundle — VITE_API_BASE_URL не попал в build. APK не сможет достучаться до бэка."
            exit 1
          fi
          grep -rl "72.56.38.62" dist/assets/ | head -3

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Force cleartext in AndroidManifest
        run: |
          sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          grep usesCleartextTraffic android/app/src/main/AndroidManifest.xml

      # CRITICAL: Capacitor 8 при `cap sync` авто-генерирует
      # android/app/src/debug/res/xml/network_security_config_debug.xml
      # с domain-config только для localhost/10.0.2.2/devServer — БЕЗ нашего
      # production-сервера. При assembleDebug этот файл ПЕРЕОПРЕДЕЛЯЕТ main
      # NSC, и OkHttp ловит "Cleartext HTTP traffic to <ip> not permitted".
      # Принудительно зеркалим main NSC в debug, чтобы permissive
      # cleartextTrafficPermitted=true применялся и в debug-варианте.
      - name: Force permissive NSC in debug build variant
        run: |
          mkdir -p android/app/src/debug/res/xml
          cp android/app/src/main/res/xml/network_security_config.xml \
             android/app/src/debug/res/xml/network_security_config_debug.xml
          echo "--- debug NSC after override ---"
          cat android/app/src/debug/res/xml/network_security_config_debug.xml

      - name: Gradle assembleDebug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --warning-mode=summary

      - name: Rename APK with version + commit
        id: meta
        run: |
          SHORT=$(git rev-parse --short HEAD)
          VERSION=$(node -p "require('./package.json').version")
          OUT_NAME="TechForum2026-v${VERSION}-${SHORT}-debug.apk"
          mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/${OUT_NAME}"
          echo "out_name=${OUT_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short=${SHORT}" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.out_name }}
          path: TechForum2026_app/android/app/build/outputs/apk/debug/${{ steps.meta.outputs.out_name }}
          retention-days: 30

      - name: Create release on tag-style commits or manual dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.meta.outputs.short }}
          name: APK build ${{ steps.meta.outputs.short }}
          body: |
            Automated debug APK from commit ${{ github.sha }}
            Backend endpoint: http://72.56.38.62/api/v1
          files: TechForum2026_app/android/app/build/outputs/apk/debug/${{ steps.meta.outputs.out_name }}
          fail_on_unmatched_files: true
