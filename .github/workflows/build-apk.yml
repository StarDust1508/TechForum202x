name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'TechForum2026_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: TechForum2026_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: TechForum2026_app/package-lock.json

      - name: Setup Java 21 (Capacitor 8 + Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Guard — production uses HTTPS only
        run: |
          if ! grep -E "androidScheme:[[:space:]]*['\"]https['\"]" capacitor.config.ts; then
            echo "::error::androidScheme must be https"
            exit 1
          fi
          echo "OK: androidScheme is https"

      - name: Write production frontend env
        run: |
          cat > .env.production <<EOF
          NODE_ENV=production
          VITE_API_BASE_URL=https://tech-pravo.ru/tfapi/v1
          VITE_WS_BASE_URL=wss://tech-pravo.ru
          VITE_ENABLE_LOCAL_FALLBACK=false
          EOF

      - name: Verify env file written
        run: cat .env.production

      # BUG_FIX_CONTEXT: vite.config.ts вызывает loadEnv но не подмешивает envPrefix
      # явно, и в предыдущих сборках VITE_API_BASE_URL не попадал в bundle (искали
      # литерал "72.56.38.62" в собранном JS — отсутствовал). Передаём ENV напрямую
      # в process.env для процесса vite build И добавляем --mode production явно.
      - name: Build Vite bundle (with explicit env)
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: https://tech-pravo.ru/tfapi/v1
          VITE_WS_BASE_URL: wss://tech-pravo.ru
          VITE_ENABLE_LOCAL_FALLBACK: 'false'
        run: |
          npx vite build --mode production
          echo "--- bundle env check ---"
          if ! grep -rq "tech-pravo.ru/tfapi/v1" dist/assets/; then
            echo "::error::API URL not baked into bundle — VITE_API_BASE_URL не попал в build. APK не сможет достучаться до бэка."
            exit 1
          fi
          grep -rl "tech-pravo.ru/tfapi/v1" dist/assets/ | head -3

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Gradle assembleRelease
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --warning-mode=summary

      - name: Rename APK with version + commit
        id: meta
        run: |
          SHORT=$(git rev-parse --short HEAD)
          VERSION=$(node -p "require('./package.json').version")
          OUT_NAME="TechForum2026-v${VERSION}-${SHORT}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/${OUT_NAME}"
          echo "out_name=${OUT_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short=${SHORT}" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.out_name }}
          path: TechForum2026_app/android/app/build/outputs/apk/release/${{ steps.meta.outputs.out_name }}
          retention-days: 30

      - name: Create release on tag-style commits or manual dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.meta.outputs.short }}
          name: APK build ${{ steps.meta.outputs.short }}
          body: |
            Android APK from commit ${{ github.sha }}
            Backend endpoint: https://tech-pravo.ru/tfapi/v1
          files: TechForum2026_app/android/app/build/outputs/apk/release/${{ steps.meta.outputs.out_name }}
          fail_on_unmatched_files: true
